[project]
name = "porter-skill"
version = "0.1.0"
description = "Automated video localization, AI captioning, translation, and standard FFmpeg release pipeline for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "RoL1n_SrP" }
]
keywords = [
    "youtube",
    "video-localization",
    "subtitles",
    "asr",
    "translation",
    "ffmpeg",
    "agent-skill",
    "hardsub"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2024.7.4",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "pillow>=10.0.0",
    "fonttools>=4.40.0",
    "langdetect>=1.0.9",
    "json-repair>=0.30.0",
    "pyyaml>=6.0.0",
    "speechrecognition>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
porter = "porter_skill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
